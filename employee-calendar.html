<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הוספת משמרות ליומן גוגל</title>
  <meta name="description" content="סנכרון והוספת משמרות עבודה ליומן Google בלחיצת כפתור">
  <meta property="og:title" content="הוספת משמרות ליומן גוגל">
  <meta property="og:description" content="סנכרון והוספת משמרות עבודה ליומן Google בלחיצת כפתור">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="he_IL">
  <link rel="stylesheet" href="styles/theme.css?v=2.1">
  <link rel="stylesheet" href="styles/base.css?v=2.1">
  <link rel="stylesheet" href="styles/layout.css?v=2.1">
  <link rel="stylesheet" href="styles/components.css?v=2.1">
</head>
<body>
  <main class="shell employee-export-shell">
    <section class="topbar">
      <div>
        <h1>הוספת משמרות ליומן</h1>
        <p class="intro">בחרו שם, בדקו את המשמרות שיוספו, ואז אשרו הוספה ליומן Google.</p>
      </div>
    </section>

    <section class="panel employee-export-panel">
      <div class="panel-header">
        <h2>Google Calendar</h2>
        <span class="badge" id="exportStatus">ממתין</span>
      </div>
      <div class="panel-body">
        <div class="employee-export-form">
          <div>
            <label for="employeeSelect">שם עובד</label>
            <select id="employeeSelect">
              <option value="">בחר/י את שמך</option>
            </select>
          </div>
        </div>

        <div class="preview-title">תצוגה מקדימה</div>
        <div id="eventPreview" class="employee-event-preview"></div>
        <div class="intake-status" id="previewMessage" role="status"></div>

        <div class="actions preview-actions">
          <button class="btn secondary" id="authorizeGoogle" type="button" disabled>התחבר עם Google</button>
          <span class="autosave-status" id="authStatus">לא מחובר</span>
        </div>
        <div class="actions preview-actions">
          <button class="btn" id="addToCalendar" type="button" disabled>הוסף ליומן Google</button>
        </div>
        <div class="helper">הכפתור הראשי מוסיף את המשמרות ישירות ליומן Google אחרי אישור הרשאה.</div>
        <div class="intake-status" id="calendarMessage" role="status"></div>
        <div class="intake-status" id="calendarIsolationNotice" role="status" hidden></div>
        <div>
          <label><input type="checkbox" id="oauthDiagnosticsEnabled" autocomplete="off"> הפעלת אבחון חיבור ליומן Google</label>
          <div id="oauthDiagnosticsPanel" hidden>
            <label for="oauthDiagnosticsReport">דוח אבחון זמני</label>
            <textarea id="oauthDiagnosticsReport" rows="8" dir="ltr" style="direction: ltr" readonly></textarea>
            <button class="btn secondary" id="copyOAuthDiagnostics" type="button">העתקת דוח האבחון</button>
            <div class="intake-status" id="oauthDiagnosticsStatus" role="status"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="src/googleConfig.js"></script>
  <script src="src/auth/googleOAuthService.js"></script>
  <script src="src/scheduleExport.js"></script>
  <script src="src/calendarService.js"></script>
  <script type="module">
    import { isCalendarExportBlocked, CALENDAR_ISOLATION_NOTICE } from "./src/calendarIsolation.js";

    function showIsolationNotice() {
      if (!isCalendarExportBlocked()) return false;
      const notice = document.getElementById("calendarIsolationNotice");
      notice.hidden = false;
      notice.textContent = CALENDAR_ISOLATION_NOTICE;
      document.getElementById("authorizeGoogle").disabled = true;
      document.getElementById("addToCalendar").disabled = true;
      document.getElementById("authStatus").textContent = "מצב פיתוח מבודד";
      return true;
    }

    showIsolationNotice();
    const employeeSelectEl = document.getElementById("employeeSelect");
    const eventPreviewEl = document.getElementById("eventPreview");
    const previewMessageEl = document.getElementById("previewMessage");
    const authorizeGoogleEl = document.getElementById("authorizeGoogle");
    const authStatusEl = document.getElementById("authStatus");
    const addToCalendarEl = document.getElementById("addToCalendar");
    const calendarMessageEl = document.getElementById("calendarMessage");
    const exportStatusEl = document.getElementById("exportStatus");
    const diagnosticsEnabledEl = document.getElementById("oauthDiagnosticsEnabled");
    const diagnosticsPanelEl = document.getElementById("oauthDiagnosticsPanel");
    const diagnosticsReportEl = document.getElementById("oauthDiagnosticsReport");
    const diagnosticsStatusEl = document.getElementById("oauthDiagnosticsStatus");
    let diagnosticLines = null;
    let diagnosticSession = 0;
    let diagnosticAttempt = 0;

    function recordDiagnostic(event, details) {
      if (!diagnosticLines) return;
      if (diagnosticLines.length === 200) {
        diagnosticLines.push("Diagnostic limit reached. Turn diagnostics off and on to start a new report.");
      } else if (diagnosticLines.length < 200) {
        const timestamp = new Date().toISOString();
        diagnosticLines.push(`${timestamp} ${event}${details ? ` ${JSON.stringify(details)}` : ""}`);
      }
      diagnosticsReportEl.value = diagnosticLines.join("\n");
    }

    diagnosticsEnabledEl.checked = false;
    diagnosticsEnabledEl.addEventListener("change", () => {
      const enabled = diagnosticsEnabledEl.checked;
      diagnosticSession++;
      diagnosticLines = enabled ? [] : null;
      diagnosticAttempt = 0;
      diagnosticsPanelEl.hidden = !enabled;
      diagnosticsReportEl.value = "";
      diagnosticsStatusEl.textContent = "";
      recordDiagnostic("diagnostics_enabled", { connected: googleOAuthService.isAuthorized() });
    });
    document.getElementById("copyOAuthDiagnostics").addEventListener("click", async () => {
      if (!diagnosticLines) return;
      const session = diagnosticSession;
      try {
        await navigator.clipboard.writeText(diagnosticsReportEl.value);
        if (diagnosticSession === session) diagnosticsStatusEl.textContent = "דוח האבחון הועתק.";
      } catch {
        if (diagnosticSession === session) diagnosticsStatusEl.textContent = "לא ניתן להעתיק אוטומטית. אפשר להעתיק את הטקסט ידנית.";
      }
    });

    let finalizedSchedule = null;
    let oauthConfigured = false;
    let oauthReady = false;
    let authorizationExpiresAt = 0;
    let authorizationExpiryTimer;

    function refreshAuthorizationStatus() {
      if (!authorizationExpiresAt) return;
      clearTimeout(authorizationExpiryTimer);
      if (googleOAuthService.isAuthorized()) {
        authorizationExpiryTimer = setTimeout(refreshAuthorizationStatus, authorizationExpiresAt - Date.now());
        return;
      }
      authorizationExpiresAt = 0;
      authStatusEl.textContent = "לא מחובר";
      recordDiagnostic("connection_expired");
      addToCalendarEl.disabled = true;
      calendarMessageEl.textContent = "פג תוקף ההרשאה ליומן Google. יש להתחבר מחדש.";
    }

    function renderLoading() {
      exportStatusEl.textContent = "טוען...";
      calendarMessageEl.textContent = "טוען את נתוני הסידור...";
      employeeSelectEl.disabled = true;
      authorizeGoogleEl.disabled = true;
      addToCalendarEl.disabled = true;
      eventPreviewEl.innerHTML = "";
    }

    function displayDate(value) {
      const date = new Date(`${value}T12:00:00`);
      return `${date.getDate()}.${date.getMonth() + 1}.${date.getFullYear()}`;
    }

    function renderError(message) {
      exportStatusEl.textContent = "שגיאה";
      calendarMessageEl.textContent = message;
      employeeSelectEl.disabled = true;
      authorizeGoogleEl.disabled = true;
      eventPreviewEl.innerHTML = "";
      addToCalendarEl.disabled = true;
    }

    function renderEmployeeOptions() {
      employeeSelectEl.innerHTML = [
        '<option value="">בחר/י את שמך</option>',
        ...finalizedSchedule.employees.map(employee => `<option value="${employee.id}">${employee.name}</option>`)
      ].join("");
      employeeSelectEl.value = "";
    }

    function selectedEvents() {
      if (!employeeSelectEl.value) return [];
      return calendarService.shiftsForEmployee(finalizedSchedule, employeeSelectEl.value);
    }

    function resetAddButton() {
      addToCalendarEl.classList.remove("success");
      addToCalendarEl.textContent = "הוסף ליומן Google";
    }

    function setCreatedButton() {
      addToCalendarEl.classList.add("success");
      addToCalendarEl.textContent = "האירוע נוצר";
      addToCalendarEl.disabled = true;
    }

    function allSelectedEventsCreated(events = selectedEvents()) {
      if (!events.length) return false;
      const createdEvents = calendarService.readCreatedEvents();
      return events.every(event => Boolean(createdEvents[event.key]?.googleEventId));
    }

    function renderPreview() {
      previewMessageEl.textContent = "";
      try {
        renderShiftPreview();
      } catch {
        eventPreviewEl.innerHTML = "";
        recordDiagnostic("preview_failed");
        addToCalendarEl.disabled = true;
        exportStatusEl.textContent = "שגיאה בתצוגה";
        previewMessageEl.textContent = "לא ניתן להציג את המשמרות. נסו לבחור את השם מחדש.";
      }
    }

    function renderShiftPreview() {
      resetAddButton();
      if (!employeeSelectEl.value) {
        eventPreviewEl.innerHTML = "";
        exportStatusEl.textContent = "ממתין";
        addToCalendarEl.disabled = true;
        return;
      }

      const events = selectedEvents();
      if (!events.length) {
        eventPreviewEl.innerHTML = `<div class="employee-empty-state">No shifts found for this employee</div>`;
        exportStatusEl.textContent = "אין משמרות";
        addToCalendarEl.disabled = true;
        return;
      }

      exportStatusEl.textContent = `${events.length} משמרות`;
      if (allSelectedEventsCreated(events)) {
        setCreatedButton();
      } else {
        addToCalendarEl.disabled = isCalendarExportBlocked() || !oauthConfigured || !googleOAuthService.isAuthorized();
      }
      eventPreviewEl.innerHTML = events.map(event => `
        <div class="employee-event-row">
          <div>
            <strong>${event.title}</strong>
            <span>${displayDate(event.date)} · ${event.dayName}</span>
          </div>
          <div dir="ltr">${event.startTime}–${event.endTime}</div>
        </div>
      `).join("");
    }

    async function prepareGoogleAuthorization() {
      recordDiagnostic("identity_loading");
      authorizeGoogleEl.disabled = true;
      authStatusEl.textContent = "טוען את ההתחברות ל-Google...";
      try {
        await googleOAuthService.initialize();
        oauthReady = true;
        recordDiagnostic("identity_ready");
        calendarMessageEl.textContent = "יש להתחבר עם Google לפני הוספה ליומן.";
      } catch {
        recordDiagnostic("identity_load_failed");
        calendarMessageEl.textContent = "טעינת ההתחברות ל-Google נכשלה. לחצו על כפתור ההתחברות כדי לנסות שוב.";
      } finally {
        authStatusEl.textContent = "לא מחובר";
        authorizeGoogleEl.disabled = isCalendarExportBlocked();
      }
    }

    async function handleAuthorizeGoogle() {
      if (showIsolationNotice()) return;
      if (!oauthConfigured) {
        calendarMessageEl.textContent = "הגדרת מנהל נדרשת: יש להגדיר Google OAuth Client ID בקובץ src/googleConfig.js.";
        return;
      }
      if (!oauthReady) {
        await prepareGoogleAuthorization();
        return;
      }
      authorizeGoogleEl.disabled = true;
      addToCalendarEl.disabled = true;
      clearTimeout(authorizationExpiryTimer);
      authorizationExpiresAt = 0;
      calendarMessageEl.textContent = "";
      authStatusEl.textContent = "מתחבר...";
      const session = diagnosticSession;
      const attempt = diagnosticLines ? ++diagnosticAttempt : 0;
      const report = attempt ? (event, details) => {
        if (diagnosticSession === session) recordDiagnostic(event, { attempt, ...details });
      } : undefined;
      report?.("connection_pending");
      try {
        const { expiresAt } = await googleOAuthService.signIn(report);
        authorizationExpiresAt = expiresAt;
      } catch (error) {
        authStatusEl.textContent = "לא מחובר";
        report?.("connection_failed");
        addToCalendarEl.disabled = true;
        calendarMessageEl.textContent = error.message || "לא ניתן להתחבר ליומן Google. אפשר לנסות שוב.";
        return;
      } finally {
        authorizeGoogleEl.disabled = isCalendarExportBlocked();
      }
      authStatusEl.textContent = "מחובר";
      report?.("connection_connected");
      calendarMessageEl.textContent = "ההרשאה התקבלה. בדקו את התצוגה המקדימה ואשרו הוספה ליומן.";
      refreshAuthorizationStatus();
      renderPreview();
    }

    async function handleAddToGoogleCalendar() {
      if (showIsolationNotice()) return;
      if (!employeeSelectEl.value) {
        return;
      }
      if (allSelectedEventsCreated()) {
        setCreatedButton();
        calendarMessageEl.textContent = "המשמרות כבר נוספו ליומן.";
        return;
      }
      const accessToken = googleOAuthService.getAccessToken();
      if (!accessToken) {
        refreshAuthorizationStatus();
        addToCalendarEl.disabled = true;
        calendarMessageEl.textContent = "יש להתחבר עם Google לפני הוספה ליומן.";
        return;
      }

      addToCalendarEl.disabled = true;
      authorizeGoogleEl.disabled = true;
      addToCalendarEl.classList.remove("success");
      addToCalendarEl.textContent = "מוסיף ליומן...";
      let completed = false;
      try {
        const result = await calendarService.createGoogleCalendarEvents({
          schedule: finalizedSchedule,
          employeeId: employeeSelectEl.value,
          accessToken
        });
        completed = true;
        setCreatedButton();
        calendarMessageEl.textContent = result.existingCount >= result.events.length
          ? "המשמרות כבר נוספו ליומן."
          : "המשמרות נוספו ליומן Google בהצלחה.";
      } catch (error) {
        calendarMessageEl.textContent = error.message || "Google Calendar authorization failed. Please retry.";
      } finally {
        authorizeGoogleEl.disabled = isCalendarExportBlocked();
        if (!completed) {
          renderPreview();
        }
      }
    }

    async function initEmployeeCalendarPage() {
      renderLoading();
      try {
        finalizedSchedule = await scheduleExport.readEmployeePayload();
        if (!finalizedSchedule?.scheduleId || !Array.isArray(finalizedSchedule.employees) || !Array.isArray(finalizedSchedule.entries)) {
          throw new Error("קישור הסידור אינו תקין או שחסרים בו נתונים.");
        }
        employeeSelectEl.disabled = false;
        renderEmployeeOptions();
        renderPreview();
        employeeSelectEl.addEventListener("change", renderPreview);
        authorizeGoogleEl.addEventListener("click", handleAuthorizeGoogle);
        addToCalendarEl.addEventListener("click", handleAddToGoogleCalendar);
        document.addEventListener("visibilitychange", refreshAuthorizationStatus);
        window.addEventListener("pageshow", refreshAuthorizationStatus);
        oauthConfigured = googleOAuthService.hasConfiguredClient();
        authorizeGoogleEl.disabled = !oauthConfigured;
        if (showIsolationNotice()) {
          calendarMessageEl.textContent = CALENDAR_ISOLATION_NOTICE;
        } else if (!oauthConfigured) {
          authStatusEl.textContent = "Google OAuth לא מוגדר";
          authorizeGoogleEl.disabled = true;
          addToCalendarEl.disabled = true;
          calendarMessageEl.textContent = "הגדרת מנהל נדרשת: יש להגדיר Google OAuth Client ID בקובץ src/googleConfig.js לפני הוספה ישירה ליומן.";
        } else {
          addToCalendarEl.disabled = true;
          await prepareGoogleAuthorization();
        }
      } catch (error) {
        renderError(error.message || "לא ניתן לטעון את הסידור מהקישור.");
      }
    }

    initEmployeeCalendarPage();
  </script>
</body>
</html>
